<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Dashboard</title>
    <link rel="stylesheet" href="Css/style.css">
</head>
<body>
    <header>
        <h1>Matthew Davis</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
    <section id="contactPage">
          <div id="form-container">
            <form id="contact-form" >
                <label class="form-label" for="full-name">Full name:</label><br>
                <input class="input" placeholder="Name" class="form-input" type="text" required>
                <br>
                <label class="form-label" for="email-address">Email address:</label> <br>
                <input class="input" placeholder="Email" class="form-input" type="email" required>
                <br>
                <label class="form-label" for="company-name">Company name (optional):</label><br>
                <input class="input"  placeholder="Company" class="form-input" type="text">
                <br>
                <label class="form-label" for="message">Your message:</label><br>
                <textarea class="input"  placeholder="Message" class="form-textarea" required></textarea>
                <br>
                <br>
              <button id="form-button" type="submit">Send message</button>
            </form>
          </div>
      </section>
    </main>
    <div class="static">
    </div>
    <footer>
        <p>&copy; 2025 Portfolio Dashboard</p>
    </footer>
</body>
</html>
